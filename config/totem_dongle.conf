# Dongle runs the keymap: keep pointing/mouse behaviors available.
CONFIG_ZMK_POINTING=y
# USB-powered, so never sleep; show the halves' battery on the screen.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector screen. BeeKeeb's connector-board build omits the ambient light
# sensor; if yours has one, set the first line to y and drop the second.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
# Screen layout: CLASSIC is the default; swap for RADII, FIELD or OPERATOR.
CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
# Uncomment if the image is upside down in your case orientation.
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
